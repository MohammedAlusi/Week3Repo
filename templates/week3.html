<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        ul { list-style: none; padding: 0; }
        li { margin: 8px 0; }
        button { margin-left: 5px; }
        .done { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <h1>Todo List</h1>
    
    <input type="text" id="newTask" placeholder="Add a new todo">
    <button onclick="addTodo()">Add</button>
    
    <ul id="todoList"></ul>

    <script>
        // Load todos on page load
        async function loadTodos() {
            const response = await fetch('/todos');
            const todos = await response.json();
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            todos.forEach(todo => {
                const li = document.createElement('li');
                li.id = `todo-${todo.id}`;
                li.innerHTML = `
                    <span id="task-${todo.id}" class="${todo.done ? 'done' : ''}">${todo.task}</span>
                    <button onclick="toggleDone(${todo.id})">${todo.done ? 'Undo' : 'Done'}</button>
                    <button onclick="editTodo(${todo.id})">Edit</button>
                    <button onclick="deleteTodo(${todo.id})">Delete</button>
                `;
                list.appendChild(li);
            });
        }

        // Add a new todo
        async function addTodo() {
            const input = document.getElementById('newTask');
            const task = input.value.trim();
            if (!task) return alert('Task cannot be empty');
            
            const response = await fetch('/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task })
            });
            if (response.ok) {
                input.value = '';
                loadTodos();
            }
        }

        // Edit a todo
        async function editTodo(id) {
            const currentText = document.getElementById(`task-${id}`).innerText;
            const newTask = prompt("Edit your todo:", currentText);
            if (!newTask || newTask.trim() === "") return;

            const response = await fetch(`/todos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task: newTask.trim() })
            });

            if (response.ok) loadTodos();
            else alert("Failed to update todo");
        }

        // Delete a todo
        async function deleteTodo(id) {
            const response = await fetch(`/todos/${id}`, { method: 'DELETE' });
            if (response.ok) loadTodos();
        }

        // Toggle done/undone
        async function toggleDone(id) {
            const span = document.getElementById(`task-${id}`);
            const done = !span.classList.contains('done');

            const response = await fetch(`/todos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ done })
            });
            if (response.ok) loadTodos();
        }

        // Initial load
        loadTodos();
    </script>
</body>
</html>
