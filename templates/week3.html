<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        ul { list-style: none; padding: 0; }
        li { margin: 8px 0; }
        button { margin-left: 5px; }
        .done { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <h1>Todo List</h1>
    
    <input type="text" id="newTask" placeholder="Add a new todo">
    <input type="text" id="newDescription" placeholder="Add a description">
    <button onclick="addTodo()">Add</button>
    
    <ul id="todoList"></ul>

    <script>
        // Load todos
        async function loadTodos() {
            const response = await fetch('/todos');
            const todos = await response.json();
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            todos.forEach(todo => {
                const li = document.createElement('li');
                li.id = `todo-${todo.id}`;
                li.innerHTML = `
                    <span id="task-${todo.id}" class="${todo.done ? 'done' : ''}">${todo.task}</span>
                    <button onclick="showDescription(${todo.id})">Description</button>
                    <button onclick="toggleDone(${todo.id})">${todo.done ? 'Undo' : 'Done'}</button>
                    <button onclick="editTodo(${todo.id})">Edit</button>
                    <button onclick="deleteTodo(${todo.id})">Delete</button>
                `;
                list.appendChild(li);
            });
        }

        // Show description
        async function showDescription(id) {
            const response = await fetch('/todos');
            const todos = await response.json();
            const todo = todos.find(t => t.id === id);
            if (todo) {
                alert(`Description: ${todo.description || "No description"}`);
            }
        }

        // Add todo
        async function addTodo() {
            const task = document.getElementById('newTask').value.trim();
            const description = document.getElementById('newDescription').value.trim();
            if (!task) return alert('Task cannot be empty');

            const response = await fetch('/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task, description })
            });
            if (response.ok) {
                document.getElementById('newTask').value = '';
                document.getElementById('newDescription').value = '';
                loadTodos();
            }
        }

        // Edit todo
        async function editTodo(id) {
            const currentTask = document.getElementById(`task-${id}`).innerText;
            const newTask = prompt("Edit your todo:", currentTask);
            if (!newTask || newTask.trim() === "") return;
            const newDescription = prompt("Edit description:");

            const response = await fetch(`/todos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task: newTask.trim(), description: newDescription })
            });
            if (response.ok) loadTodos();
        }

        // Delete todo
        async function deleteTodo(id) {
            const response = await fetch(`/todos/${id}`, { method: 'DELETE' });
            if (response.ok) loadTodos();
        }

        // Toggle done
        async function toggleDone(id) {
            const span = document.getElementById(`task-${id}`);
            const done = !span.classList.contains('done');

            const response = await fetch(`/todos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ done })
            });
            if (response.ok) loadTodos();
        }

        loadTodos();
    </script>
</body>
</html>
